version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: SerivceOps-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: SerivceOps_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - SerivceOps-network

  # Uncomment to run the admin in Docker
  # admin:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: SerivceOps-admin
  #   environment:
  #     - APP=admin
  #     - DATABASE_URL=postgresql://postgres:password@postgres:5432/SerivceOps_db?schema=public
  #     - SESSION_SECRET=your-super-secret-session-key-change-this-in-production
  #     - SESSION_TTL_DAYS=7
  #     - CORS_ORIGIN=http://localhost:1600
  #   ports:
  #     - '3001:3001'
  #   depends_on:
  #     - postgres
  #   networks:
  #     - SerivceOps-network

  # Uncomment to run the user in Docker
  # user:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: SerivceOps-user
  #   environment:
  #     - APP=user
  #     - DATABASE_URL=postgresql://postgres:password@postgres:5432/SerivceOps_db?schema=public
  #     - SESSION_SECRET=your-super-secret-session-key-change-this-in-production
  #     - SESSION_TTL_DAYS=7
  #     - CORS_ORIGIN=http://localhost:1700
  #   ports:
  #     - '3002:3002'
  #   depends_on:
  #     - postgres
  #   networks:
  #     - SerivceOps-network

volumes:
  postgres_data:

networks:
  serivceops-network:
    driver: bridge
